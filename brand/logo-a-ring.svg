<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>LorryOwner — Owner's Ring</title>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#a)"/>

  <!-- The "O" of Owner, doubling as a route loop around the lorry. -->
  <circle cx="256" cy="256" r="166" fill="none" stroke="#ffffff" stroke-width="22" stroke-opacity="0.85"/>

  <!-- Lorry sized to clear the ring on all sides — wheels included, so
       nothing collides with the stroke at small sizes. -->
  <g fill="#ffffff">
    <rect x="152" y="200" width="116" height="86" rx="12"/>
    <path d="M276 230h38a14 14 0 0 1 11 5.4l26 33.4a14 14 0 0 1 3 8.6v6.6a8 8 0 0 1-8 8h-70a8 8 0 0 1-8-8v-46a8 8 0 0 1 8-8Z"/>
  </g>
  <g fill="#1E3A8A" stroke="#ffffff" stroke-width="14">
    <circle cx="194" cy="302" r="26"/>
    <circle cx="316" cy="302" r="26"/>
  </g>
</svg>
