<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>LorryOwner — Keyed Lorry</title>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#134E4A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#b)"/>

  <!-- Lorry, sitting slightly high to leave room for the key beneath. -->
  <g fill="#ffffff">
    <rect x="96" y="150" width="164" height="118" rx="16"/>
    <path d="M268 192h56a18 18 0 0 1 14.2 6.9l38 48.6a18 18 0 0 1 3.8 11.1v9.4a12 12 0 0 1-12 12H268a12 12 0 0 1-12-12v-64a12 12 0 0 1 12-12Z"/>
  </g>
  <g fill="#134E4A" stroke="#ffffff" stroke-width="18">
    <circle cx="152" cy="288" r="34"/>
    <circle cx="330" cy="288" r="34"/>
  </g>

  <!-- A key laid under the wheels: the vehicle is yours, not just tracked. -->
  <g fill="#FCD34D">
    <circle cx="140" cy="392" r="40"/>
    <circle cx="140" cy="392" r="16" fill="#134E4A"/>
    <rect x="172" y="376" width="212" height="32" rx="14"/>
    <rect x="300" y="408" width="28" height="34" rx="12"/>
    <rect x="352" y="408" width="28" height="34" rx="12"/>
  </g>
</svg>
