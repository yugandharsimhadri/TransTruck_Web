<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>LorryOwner — maskable</title>
  <defs>
    <linearGradient id="am" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Full bleed, no rounded corners: Android applies its own mask (circle,
       squircle, ...) and anything with its own corner radius shows as a
       shape-inside-a-shape once cropped. -->
  <rect width="512" height="512" fill="url(#am)"/>

  <!-- Art scaled to the 80% safe zone, so no part of the ring is ever
       clipped by the mask whatever shape the launcher uses. -->
  <g transform="translate(256,256) scale(0.8) translate(-256,-256)">
    <circle cx="256" cy="256" r="166" fill="none" stroke="#ffffff" stroke-width="22" stroke-opacity="0.85"/>
    <g fill="#ffffff">
      <rect x="152" y="200" width="116" height="86" rx="12"/>
      <path d="M276 230h38a14 14 0 0 1 11 5.4l26 33.4a14 14 0 0 1 3 8.6v6.6a8 8 0 0 1-8 8h-70a8 8 0 0 1-8-8v-46a8 8 0 0 1 8-8Z"/>
    </g>
    <g fill="#1E3A8A" stroke="#ffffff" stroke-width="14">
      <circle cx="194" cy="302" r="26"/>
      <circle cx="316" cy="302" r="26"/>
    </g>
  </g>
</svg>
